[package]
name = "leafor"
version = "0.1.0"
description = "Leafor — local-first portfolio and writing studio"
authors = ["Leafor"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "leafor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
dunce = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
